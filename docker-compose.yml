services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: deepu-fabricator-backend

    expose:
      - "8000"

    env_file:
      - ./backend/.env

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - gallery_uploads:/workspace/static/uploads/gallery

    restart: always

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

    networks:
      - deepu-network

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"



  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: deepu-fabricator-frontend

    ports:
      - "3000:80"

    depends_on:
      backend:
        condition: service_healthy

    restart: always

    networks:
      - deepu-network

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"



  db:
    image: postgres:16-alpine

    container_name: deepu-fabricator-db

    environment:
      POSTGRES_USER: deepu_user
      POSTGRES_PASSWORD: deepu_password
      POSTGRES_DB: deepu_fabricator

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U deepu_user -d deepu_fabricator"
        ]

      interval: 10s
      timeout: 5s
      retries: 5

    restart: always

    networks:
      - deepu-network

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"



volumes:

  postgres_data:

  gallery_uploads:



networks:

  deepu-network:
    driver: bridge