services:

  backend:

    build:

      context: ./backend

      dockerfile: Dockerfile


    container_name: deepu_fabricator_api


    ports:

      - "8000:8000"


    env_file:

      - ./backend/.env


    depends_on:

      db:

        condition: service_healthy


    volumes:

      - gallery_uploads:/workspace/static/uploads/gallery


    healthcheck:

      test:

        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8000/health"
        ]

      interval: 30s

      timeout: 10s

      retries: 3

      start_period: 20s


    restart: always





  db:

    image: postgres:16-alpine


    container_name: deepu_fabricator_db


    environment:

      POSTGRES_USER: deepu_user

      POSTGRES_PASSWORD: deepu_password

      POSTGRES_DB: deepu_fabricator


    volumes:

      - postgres_data:/var/lib/postgresql/data


    healthcheck:

      test:

        [
          "CMD-SHELL",
          "pg_isready -U deepu_user -d deepu_fabricator"
        ]

      interval: 10s

      timeout: 5s

      retries: 5


    restart: always





volumes:

  postgres_data:


  gallery_uploads: